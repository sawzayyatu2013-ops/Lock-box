[package]
name = "lockbox"
version = "0.1.0"
edition = "2021"
description = "Encrypt/decrypt files with a password (AES-256-GCM + Argon2id)"
license = "MIT"
repository = "https://github.com/YOURNAME/lockbox"

[[bin]]
name = "lockbox"
path = "src/main.rs"

[dependencies]
aes-gcm  = "0.10"
argon2   = "0.5"
clap     = { version = "4.5", features = ["derive"] }
rand     = "0.8"
rpassword = "7.3"
anyhow   = "1.0"
